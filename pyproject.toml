[project]
name = "medium-article-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "krishnatiwari005", email = "krishna.08072005@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agno>=3.0.10",
    "arxiv>=4.0.1",
    "ddgs>=9.16.0",
    "fastapi[standard]>=0.141.1",
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "googlesearch-python>=1.3.0",
    "groq>=1.7.0",
    "lxml-html-clean>=0.4.5",
    "newspaper4k[nlp]>=0.9.6",
    "openai>=3.16.0",
    "praw>=8.0.3",
    "pycountry>=26.2.16",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "tweepy>=4.17.0",
    "uvicorn>=0.53.0",
    "wikipedia>=1.4.0",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
medium-article-generator = "medium_article_generator:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
